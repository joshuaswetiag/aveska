services:
  postgres:
    image: postgres:16-alpine
    container_name: aveska-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aveska
      POSTGRES_PASSWORD: aveska
      POSTGRES_DB: aveska
    ports:
      - "5432:5432"
    volumes:
      - aveska_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aveska -d aveska"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aveska_pgdata:
